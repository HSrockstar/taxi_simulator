<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="650" viewBox="0 0 1260 650">
  <style>text{font-family:"Microsoft YaHei",Arial,sans-serif;fill:#17324d}.title{font-size:27px;font-weight:bold}.head{font-size:20px;font-weight:bold}.body{font-size:17px}.small{font-size:15px;fill:#49677b}.panel{stroke:#2a6f97;stroke-width:2;rx:14}.cell{fill:#cae9ff;stroke:#2a6f97;stroke-width:1.4}.node{fill:#fff;stroke:#2a6f97;stroke-width:1.8;rx:7}.arrow{stroke:#497a9f;stroke-width:2.6;fill:none;marker-end:url(#arrow)}.both{stroke:#497a9f;stroke-width:2.4;fill:none;marker-start:url(#start);marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#497a9f"/></marker><marker id="start" markerWidth="9" markerHeight="9" refX="1" refY="3" orient="auto"><path d="M8,0 L8,6 L0,3 z" fill="#497a9f"/></marker></defs>
  <rect width="1260" height="650" fill="#f7fbff"/><text x="630" y="45" text-anchor="middle" class="title">图 5　题目强制考核的三项手写数据结构</text>
  <rect class="panel" x="35" y="78" width="365" height="480" fill="#e8f5ff"/><text x="217" y="116" text-anchor="middle" class="head">GridIndex：连续网格 + 格内双向链表</text>
  <g><rect class="cell" x="105" y="157" width="58" height="58"/><rect class="cell" x="163" y="157" width="58" height="58"/><rect class="cell" x="221" y="157" width="58" height="58"/><rect class="cell" x="105" y="215" width="58" height="58"/><rect x="163" y="215" width="58" height="58" fill="#79bfdf" stroke="#2a6f97" stroke-width="1.6"/><rect class="cell" x="221" y="215" width="58" height="58"/></g><text x="192" y="306" text-anchor="middle" class="body">坐标 → 格号：O(1)</text>
  <rect class="node" x="98" y="352" width="72" height="42"/><rect class="node" x="252" y="352" width="72" height="42"/><text x="134" y="379" text-anchor="middle" class="small">司机 A</text><text x="288" y="379" text-anchor="middle" class="small">司机 B</text><path class="both" d="M176 360 H246"/><text x="211" y="346" text-anchor="middle" class="small">prev / next</text><text x="217" y="450" text-anchor="middle" class="body">链表增删、跨格迁移：O(1)</text><text x="217" y="481" text-anchor="middle" class="small">节点保存前后指针，支持摘除与插回</text>
  <rect class="panel" x="448" y="78" width="365" height="480" fill="#eaf8e7"/><text x="630" y="116" text-anchor="middle" class="head">OrderQueue：手写链式 FIFO 队列</text><text x="495" y="205" class="small">front</text><text x="734" y="205" class="small">rear</text>
  <rect class="node" x="486" y="225" width="64" height="52"/><rect class="node" x="598" y="225" width="64" height="52"/><rect class="node" x="710" y="225" width="64" height="52"/><text x="518" y="257" text-anchor="middle" class="small">O1</text><text x="630" y="257" text-anchor="middle" class="small">O2</text><text x="742" y="257" text-anchor="middle" class="small">O3</text><path class="arrow" d="M550 251 H590"/><path class="arrow" d="M662 251 H702"/><text x="630" y="356" text-anchor="middle" class="body">头删、尾插，先来先服务</text><text x="630" y="389" text-anchor="middle" class="body">入队 / 出队：O(1)</text><text x="630" y="430" text-anchor="middle" class="small">互斥锁保护队列边界，支持并发入队</text>
  <rect class="panel" x="860" y="78" width="365" height="480" fill="#fff3db"/><text x="1042" y="116" text-anchor="middle" class="head">MinHeap：动态数组最小堆</text><rect class="node" x="1015" y="160" width="62" height="45"/><rect class="node" x="930" y="255" width="62" height="45"/><rect class="node" x="1100" y="255" width="62" height="45"/><text x="1046" y="188" text-anchor="middle" class="small">最优</text><text x="961" y="283" text-anchor="middle" class="small">候选</text><text x="1131" y="283" text-anchor="middle" class="small">候选</text><path class="arrow" d="M1028 205 L975 248"/><path class="arrow" d="M1064 205 L1116 248"/><text x="1042" y="356" text-anchor="middle" class="body">堆顶为当前最优司机</text><text x="1042" y="389" text-anchor="middle" class="body">插入 / 弹出：O(log n)</text><text x="1042" y="430" text-anchor="middle" class="small">容量不足时整体搬移到两倍空间</text>
  <text x="630" y="610" text-anchor="middle" class="small">LogRingBuffer 只用于日志增量推送，是工程辅助结构，不替代上述三项核心结构。</text>
</svg>
