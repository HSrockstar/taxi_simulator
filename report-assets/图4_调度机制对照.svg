 <style>text{font-family:"Microsoft YaHei",Arial,sans-serif;fill:#17324d}.t{font-size:25px;font-weight:bold}.s{font-size:18px}.v{font-size:20px;font-weight:bold}</style><rect width="1000" height="520" fill="#f7fbff"/><text x="500" y="42" text-anchor="middle" class="t">图 4  调度机制对派单决策成功率的贡献</text><line x1="130" y1="410" x2="910" y2="410" stroke="#17324d" stroke-width="2"/><text x="90" y="412" class="s">0%</text><text x="70" y="310" class="s">15%</text><text x="70" y="207" class="s">30%</text><text x="70" y="104" class="s">45%</text><rect x="270" y="377" width="170" height="33" fill="#f29b5b"/><rect x="600" y="310" width="170" height="100" fill="#72b7b2"/><text x="355" y="365" text-anchor="middle" class="v">15.9%</text><text x="685" y="298" text-anchor="middle" class="v">48.7%</text><text x="355" y="445" text-anchor="middle" class="s">调度弱化</text><text x="355" y="472" text-anchor="middle" class="s">半径 1，阈值 5</text><text x="685" y="445" text-anchor="middle" class="s">机制全开</text><text x="685" y="472" text-anchor="middle" class="s">r6/d30/t1/w20</text><text x="500" y="505" text-anchor="middle" class="s">数据范围：当前口径 recheck_*，600 模拟秒、3 个随机种子；柱高取区间中值。</text>
