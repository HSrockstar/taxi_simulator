<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590">
  <style>text{font-family:"Microsoft YaHei",Arial,sans-serif;fill:#17324d}.t{font-size:25px;font-weight:bold}.h{font-size:21px;font-weight:bold}.s{font-size:17px}.b{stroke:#2a6f97;stroke-width:2;rx:12}.a{stroke:#497a9f;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#497a9f"/></marker></defs>
  <rect width="1200" height="590" fill="#f7fbff"/><text x="600" y="42" text-anchor="middle" class="t">图 2  题目强制考核的三项手写数据结构</text>
  <rect class="b" x="42" y="88" width="340" height="410" fill="#e6f5ff"/><text x="212" y="126" text-anchor="middle" class="h">GridIndex：连续网格 + 格内双向链表</text><g fill="#cae9ff" stroke="#2a6f97"><rect x="84" y="165" width="55" height="55"/><rect x="139" y="165" width="55" height="55"/><rect x="194" y="165" width="55" height="55"/><rect x="84" y="220" width="55" height="55"/><rect x="139" y="220" width="55" height="55"/><rect x="194" y="220" width="55" height="55"/></g><rect x="139" y="220" width="55" height="55" fill="#80c9ed" stroke="#2a6f97"/><text x="212" y="320" text-anchor="middle" class="s">坐标 → 格号：O(1)</text><rect class="b" x="100" y="347" width="65" height="38" fill="#fff"/><rect class="b" x="210" y="347" width="65" height="38" fill="#fff"/><path class="a" d="M165 366 H204"/><path class="a" d="M210 378 H171"/><text x="212" y="426" text-anchor="middle" class="s">司机增删、跨格迁移：O(1)</text>
  <rect class="b" x="430" y="88" width="340" height="410" fill="#eaf8e7"/><text x="600" y="126" text-anchor="middle" class="h">OrderQueue：手写链式 FIFO 队列</text><text x="468" y="205" class="s">front</text><rect class="b" x="470" y="220" width="58" height="48" fill="#fff"/><rect class="b" x="570" y="220" width="58" height="48" fill="#fff"/><rect class="b" x="670" y="220" width="58" height="48" fill="#fff"/><path class="a" d="M528 244 H563"/><path class="a" d="M628 244 H663"/><text x="735" y="205" class="s">rear</text><text x="600" y="330" text-anchor="middle" class="s">头删、尾插，先来先服务</text><text x="600" y="365" text-anchor="middle" class="s">入队 / 出队：O(1)</text>
  <rect class="b" x="818" y="88" width="340" height="410" fill="#fff3db"/><text x="988" y="126" text-anchor="middle" class="h">MinHeap：动态数组最小堆</text><rect class="b" x="960" y="165" width="55" height="42" fill="#fff"/><rect class="b" x="900" y="255" width="55" height="42" fill="#fff"/><rect class="b" x="1020" y="255" width="55" height="42" fill="#fff"/><path class="a" d="M979 207 L930 248"/><path class="a" d="M995 207 L1045 248"/><text x="988" y="342" text-anchor="middle" class="s">堆顶为当前最优司机</text><text x="988" y="377" text-anchor="middle" class="s">插入 / 弹出：O(log n)</text>
  <text x="600" y="550" text-anchor="middle" class="s">LogRingBuffer 为日志增量推送的工程辅助结构，不替代以上三项课程核心结构。</text>
</svg>
