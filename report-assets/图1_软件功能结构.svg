<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <style>text{font-family:"Microsoft YaHei",Arial,sans-serif;fill:#17324d}.t{font-size:25px;font-weight:bold}.h1{font-size:19px;font-weight:bold}.s1{font-size:15px}.box{stroke:#2a6f97;stroke-width:2;rx:16}.leaf{fill:#ffffff;stroke:#9cc3de;stroke-width:1.5;rx:10}.arrow{stroke:#497a9f;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#497a9f"/></marker></defs>
  <rect width="1200" height="640" fill="#f7fbff"/>
  <text x="600" y="45" text-anchor="middle" class="t">图 1  系统软件功能结构</text>
  <rect class="box" x="430" y="82" width="340" height="66" fill="#eaf8e9"/><text x="600" y="111" text-anchor="middle" class="h1">智能网约车调度模拟系统</text><text x="600" y="133" text-anchor="middle" class="s1" fill="#4a6b80" style="font-size:13px">调度引擎 · 可视化看板 · 服务控制 · 质量工具</text>
  <path class="arrow" d="M575 148 L200 186"/><path class="arrow" d="M590 148 L462 186"/><path class="arrow" d="M610 148 L738 186"/><path class="arrow" d="M625 148 L1000 186"/>
  <rect class="box" x="36" y="190" width="270" height="56" fill="#e8f7e9"/><text x="171" y="224" text-anchor="middle" class="h1">调度引擎</text>
  <rect class="leaf" x="36" y="266" width="270" height="52"/><text x="171" y="297" text-anchor="middle" class="s1">网格化流式撮合（最小堆选优）</text>
  <rect class="leaf" x="36" y="326" width="270" height="52"/><text x="171" y="357" text-anchor="middle" class="s1">供需失衡检测与动态调度</text>
  <rect class="leaf" x="36" y="386" width="270" height="52"/><text x="171" y="417" text-anchor="middle" class="s1">司机、订单双状态机流转</text>
  <rect class="leaf" x="36" y="446" width="270" height="52"/><text x="171" y="477" text-anchor="middle" class="s1">空闲司机游走与定向漂移</text>
  <rect class="leaf" x="36" y="506" width="270" height="52"/><text x="171" y="537" text-anchor="middle" class="s1">订单批量生成与超时取消</text>
  <rect class="box" x="322" y="190" width="270" height="56" fill="#dff4ff"/><text x="457" y="224" text-anchor="middle" class="h1">可视化看板</text>
  <rect class="leaf" x="322" y="266" width="270" height="52"/><text x="457" y="297" text-anchor="middle" class="s1">100×100 网格供需热力图</text>
  <rect class="leaf" x="322" y="326" width="270" height="52"/><text x="457" y="357" text-anchor="middle" class="s1">警报红框 · 调度流向动画</text>
  <rect class="leaf" x="322" y="386" width="270" height="52"/><text x="457" y="417" text-anchor="middle" class="s1">接客、行程在途渲染</text>
  <rect class="leaf" x="322" y="446" width="270" height="52"/><text x="457" y="477" text-anchor="middle" class="s1">网格悬停查询明细</text>
  <rect class="leaf" x="322" y="506" width="270" height="52"/><text x="457" y="537" text-anchor="middle" class="s1">派单实时日志</text>
  <rect class="leaf" x="322" y="566" width="270" height="52"/><text x="457" y="597" text-anchor="middle" class="s1">指标卡片 · 趋势图 · 参数面板</text>
  <rect class="box" x="608" y="190" width="270" height="56" fill="#fff3db"/><text x="743" y="224" text-anchor="middle" class="h1">服务与控制</text>
  <rect class="leaf" x="608" y="266" width="270" height="52"/><text x="743" y="297" text-anchor="middle" class="s1">HTTP 接口（快照/参数/控制）</text>
  <rect class="leaf" x="608" y="326" width="270" height="52"/><text x="743" y="357" text-anchor="middle" class="s1">SSE 实时快照推送</text>
  <rect class="leaf" x="608" y="386" width="270" height="52"/><text x="743" y="417" text-anchor="middle" class="s1">静态页面托管（web/）</text>
  <rect class="leaf" x="608" y="446" width="270" height="52"/><text x="743" y="477" text-anchor="middle" class="s1">暂停 / 继续 / 重置</text>
  <rect class="box" x="894" y="190" width="270" height="56" fill="#f2e9fb"/><text x="1029" y="224" text-anchor="middle" class="h1">测试与数据工具</text>
  <rect class="leaf" x="894" y="266" width="270" height="52"/><text x="1029" y="297" text-anchor="middle" class="s1">单元测试（八组 55 项断言）</text>
  <rect class="leaf" x="894" y="326" width="270" height="52"/><text x="1029" y="357" text-anchor="middle" class="s1">参数扫参工具（批量仿真）</text>
  <rect class="leaf" x="894" y="386" width="270" height="52"/><text x="1029" y="417" text-anchor="middle" class="s1">演示参数与原始 CSV 数据</text>
